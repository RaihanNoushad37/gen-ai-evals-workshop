[project]
name = "evals-workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlflow>=3.4,<4",
  "litellm>=1.60",
  "datasets>=3.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "python-dotenv>=1.0",
  "tiktoken>=0.8",
  "ipywidgets>=8.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "jupytext>=1.16",
    "ipykernel>=6",
    "nbconvert>=7.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals_workshop"]
